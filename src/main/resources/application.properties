spring.application.name=tomcat-deployment-manager

# Local, uncommitted overrides (DB password, TDL_APP_ENCRYPTION_KEY, ...). See .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${TDL_DB_URL:jdbc:postgresql://localhost:5432/tomcat_manager}
spring.datasource.username=${TDL_DB_USERNAME:tomcat_manager}
spring.datasource.password=${TDL_DB_PASSWORD:}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${TDL_SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
# Error pages never show stack traces, exception text or binding details.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.whitelabel.enabled=false

# Only health and info; never env, configprops, heapdump or other endpoints that could reveal secrets.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
# Notification email is optional: an unreachable or unconfigured SMTP server must not mark the application DOWN.
management.health.mail.enabled=false

# AES-256-GCM key for stored credentials: Base64 of 32 random bytes (openssl rand -base64 32).
app.security.encryption-key=${TDL_APP_ENCRYPTION_KEY:}
# Previous key during a key rotation (decrypt only); remove after re-encrypting under Settings.
app.security.encryption-key-previous=${APP_ENCRYPTION_KEY_PREVIOUS:}

# Accounts. No account with a known password exists unless APP_DEV_USERS=true (development only).
# First administrator: APP_BOOTSTRAP_ADMIN_USERNAME/PASSWORD (temporary; must be changed), else a setup token in the log.
app.security.dev-users=${APP_DEV_USERS:false}
app.security.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.security.max-failed-logins=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.lockout-duration=${LOGIN_LOCKOUT_DURATION:PT15M}
app.security.min-password-length=${PASSWORD_MIN_LENGTH:8}

# Optional notification email (SMTP). Without SPRING_MAIL_HOST only in-application notifications are used.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.notifications.email-from=${NOTIFICATION_EMAIL_FROM:tomcat-deployment-manager@localhost}
# Public base URL used for links in emails, e.g. https://deploy.example.com
app.notifications.base-url=${APP_BASE_URL:}

# Release library. Keep the storage directory private (never web-served) and outside the app directory in production.
app.release.storage-dir=${TDL_ARTIFACT_STORAGE:./var/artifacts}
app.release.max-upload-size=${RELEASE_MAX_UPLOAD_SIZE:1GB}
# Whether DEPLOYMENT_OPERATOR may upload releases (administrators always can).
app.release.operator-upload-enabled=${RELEASE_OPERATOR_UPLOAD:true}
# Multipart parts are streamed to disk, never buffered in memory; limits follow the release limit.
spring.servlet.multipart.max-file-size=${RELEASE_MAX_UPLOAD_SIZE:1GB}
spring.servlet.multipart.max-request-size=${RELEASE_MAX_REQUEST_SIZE:1100MB}
spring.servlet.multipart.file-size-threshold=0

# Remote connectivity
app.connection.max-concurrent-tests=${CONNECTION_MAX_CONCURRENT_TESTS:4}
# SSRF guard: loopback and link-local (cloud metadata) targets are refused unless enabled.
app.connection.target-policy.allow-loopback=${CONNECTION_ALLOW_LOOPBACK:false}
app.connection.target-policy.allow-link-local=false
app.connection.target-policy.allow-private=true
# Optional comma-separated allow/deny lists, e.g. 10.20.0.0/16,192.168.50.0/24
app.connection.target-policy.allowed-cidrs=${CONNECTION_ALLOWED_CIDRS:}
app.connection.target-policy.denied-cidrs=${CONNECTION_DENIED_CIDRS:}
# Optional dedicated trust store for Tomcat Manager HTTPS; JVM default trust store otherwise.
app.connection.tls.trust-store=${TLS_TRUST_STORE:}
app.connection.tls.trust-store-password=${TLS_TRUST_STORE_PASSWORD:}
app.connection.tls.trust-store-type=${TLS_TRUST_STORE_TYPE:PKCS12}

# Deployment engine
app.deployment.startup-timeout-seconds=${DEPLOYMENT_STARTUP_TIMEOUT:300}
app.deployment.consecutive-successes=${DEPLOYMENT_CONSECUTIVE_SUCCESSES:2}
app.deployment.max-concurrent-deployments=${DEPLOYMENT_MAX_CONCURRENT:2}
app.deployment.max-parallel-targets=${DEPLOYMENT_MAX_PARALLEL_TARGETS:4}
# Backups of replaced WARs: private, backed up, outside the application directory in production.
app.deployment.backup-dir=${TDL_DEPLOYMENT_BACKUP_DIR:./var/backups}
# Server backups kept per instance and context path (older ones are pruned; the current restore point never is). 0 = keep all.
app.deployment.backup-retention-per-context=${DEPLOYMENT_BACKUP_RETENTION:10}

# Application health monitoring (scheduled checks of each instance's health URL)
app.health.monitoring-enabled=${HEALTH_MONITORING_ENABLED:true}
app.health.monitor-interval=${HEALTH_MONITOR_INTERVAL:PT5M}
app.health.max-concurrent-checks=${HEALTH_MAX_CONCURRENT_CHECKS:4}
app.health.retention=${HEALTH_RETENTION:P30D}

# Display time zone for timestamps (stored in UTC); defaults to the server zone.
app.display-time-zone=${APP_TIME_ZONE:}

logging.pattern.correlation=[%X{correlationId:-}]
