<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme-mode="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status} + ' | Tomcat Deployment Manager'">Error | Tomcat Deployment Manager</title>
    <link rel="icon" th:href="@{/assets/images/brand/toggle-logo.svg}" type="image/svg+xml">
    <script th:src="@{/js/theme-init.js}"></script>
    <link th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/css/styles.min.css}" rel="stylesheet">
    <link th:href="@{/assets/icon-fonts/remixicon/remixicon.css}" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div class="page">
    <div class="error-page">
        <div class="container">
            <div class="text-center p-5 my-auto">
                <div class="row align-items-center justify-content-center h-100">
                    <div class="col-xl-7">
                        <p class="error-text text-primary mb-sm-0 mb-2" th:text="${status}">500</p>
                        <p class="fs-18 fw-medium mb-3" th:text="${status == 404} ? 'The page or record was not found.' : (${status == 403} ? 'Access denied.' : 'Something went wrong.')">Something went wrong.</p>
                        <div class="row justify-content-center mb-5">
                            <div class="col-xl-8">
                                <p class="mb-0 op-7" th:if="${status == 404}" th:text="${message ?: 'The page or record does not exist.'}">The page or record does not exist.</p>
                                <p class="mb-0 op-7" th:if="${status == 403}">Your role does not permit this action. Ask an administrator if you need access.</p>
                                <p class="mb-0 op-7" th:if="${status != 404 and status != 403}">The error was logged. Please try again or contact an administrator.</p>
                            </div>
                        </div>
                        <a class="btn btn-primary" th:href="@{/}"><i class="ri-arrow-left-line align-middle me-1 d-inline-block"></i>Back to dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
