<!DOCTYPE html>
<html lang="en" dir="ltr" data-nav-layout="vertical" data-theme-mode="light" data-header-styles="dark" data-menu-styles="dark" data-toggled="close" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="page">
<header th:replace="~{fragments/layout :: header}"></header>
<aside th:replace="~{fragments/layout :: sidebar('infra-groups')}"></aside>
<main class="main-content app-content">
<div class="container-fluid">
    <nav aria-label="breadcrumb"><ol class="breadcrumb small">
        <li class="breadcrumb-item">Infrastructure</li>
        <li class="breadcrumb-item"><a th:href="@{/infrastructure/groups}">Server groups</a></li>
        <li class="breadcrumb-item active" th:text="${group.id == null ? 'Create server group' : 'Edit server group'}">Server group</li>
    </ol></nav>
    <section class="panel" style="max-width: 760px">
        <h1 class="h4 mb-4" th:text="${group.id == null ? 'Create server group' : 'Edit server group'}">Server group</h1>
        <form th:action="@{/infrastructure/groups/save}" th:object="${group}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">
            <!-- Team: chosen when the group is created, fixed afterwards; a group contains only its team's instances. -->
            <div class="mb-3" th:if="${group.id == null}"><label class="form-label" for="teamId">Team</label>
                <select class="form-select" th:field="*{teamId}" th:errorclass="is-invalid" required>
                    <option value="" th:if="${#lists.size(teams) != 1}">Choose a team…</option>
                    <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{teamId}"></div>
                <div class="form-text">The group can contain only this team's Tomcat instances. It cannot be changed later.</div></div>
            <div class="mb-3" th:if="${group.id != null and groupTeam != null}"><span class="form-label d-block">Team</span>
                <span class="badge text-bg-light border" th:text="${groupTeam.name}">Team</span></div>
            <div class="mb-3"><label class="form-label" for="name">Group name</label>
                <input class="form-control" th:field="*{name}" th:errorclass="is-invalid" required maxlength="100" placeholder="Production - Europe">
                <div class="invalid-feedback" th:errors="*{name}"></div></div>
            <div class="mb-4"><label class="form-label" for="description">Description</label>
                <textarea class="form-control" th:field="*{description}" maxlength="500" rows="3"></textarea></div>
            <button class="btn btn-primary">Save group</button>
            <a class="btn btn-outline-secondary" th:href="${group.id == null} ? @{/infrastructure/groups} : @{/infrastructure/groups/{id}(id=${group.id})}">Cancel</a>
        </form>
    </section>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
