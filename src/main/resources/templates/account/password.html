<!DOCTYPE html>
<html lang="en" dir="ltr" data-nav-layout="vertical" data-theme-mode="light" data-header-styles="dark" data-menu-styles="dark" data-toggled="close" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="page">
<header th:replace="~{fragments/layout :: header}"></header>
<aside th:replace="~{fragments/layout :: sidebar('account')}"></aside>
<main class="main-content app-content">
<div class="container-fluid">
    <nav aria-label="breadcrumb"><ol class="breadcrumb small">
        <li class="breadcrumb-item"><a th:href="@{/account}">My account</a></li>
        <li class="breadcrumb-item active">Change password</li>
    </ol></nav>
    <section class="panel" style="max-width: 620px">
        <h1 class="h4 mb-2">Change password</h1>
        <div class="alert alert-warning small" th:if="${required}" role="alert">
            <strong>Choose your own password to continue.</strong> Your current password is temporary (new account or reset by an administrator).
        </div>
        <div class="alert alert-danger small" th:if="${error}" th:text="${error}" role="alert"></div>
        <form th:action="@{/account/password}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="currentPassword" th:text="${required} ? 'Temporary password' : 'Current password'">Current password</label>
                <input class="form-control" type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="newPassword">New password</label>
                <input class="form-control" type="password" id="newPassword" name="newPassword" autocomplete="new-password" required th:attr="minlength=${minPasswordLength}" data-password-meter>
                <div class="form-text"><span th:text="'At least ' + ${minPasswordLength} + ' characters'">At least 8 characters</span> with varied characters; must not contain your username (<span th:text="${user.username}"></span>). A passphrase of several words works well.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="passwordConfirmation">Repeat new password</label>
                <input class="form-control" type="password" id="passwordConfirmation" name="passwordConfirmation" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Change password</button>
            <a class="btn btn-outline-secondary" th:href="@{/account}" th:unless="${required}">Cancel</a>
        </form>
    </section>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
