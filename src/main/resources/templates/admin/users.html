<!DOCTYPE html>
<html lang="en" dir="ltr" data-nav-layout="vertical" data-theme-mode="light" data-header-styles="dark" data-menu-styles="dark" data-toggled="close" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="page">
<header th:replace="~{fragments/layout :: header}"></header>
<aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>
<main class="main-content app-content">
<div class="container-fluid">
    <div class="page-intro d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <div class="eyebrow">ADMINISTRATION</div>
            <h1 class="h3 mb-1">Users</h1>
            <p class="text-secondary mb-0">Local accounts and their roles. Accounts are disabled rather than deleted, so the audit history stays intact.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/users/new}"><i class="bx bx-plus me-1"></i>Create user</a>
    </div>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>

    <div class="row g-3 mb-3">
        <div class="col-12 col-lg-4" th:each="r : ${roles}">
            <div class="metric-card h-100"><div class="metric-label" th:text="${r.label()}">Role</div>
                <div class="small text-secondary" th:text="${r.description()}"></div></div>
        </div>
    </div>

    <section class="panel p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Password</th><th class="text-end"></th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td><a class="fw-semibold" th:href="@{/admin/users/{id}/edit(id=${u.id})}" th:text="${u.username}"></a>
                        <span th:if="${u.username == #authentication.name}" class="badge text-bg-light border ms-1">you</span>
                        <div class="small text-secondary" th:text="${(u.displayName ?: '') + (u.email != null ? ' · ' + u.email : '')}"></div></td>
                    <td><span class="badge" th:classappend="${u.role.name() == 'ADMIN'} ? ' text-bg-dark' : (${u.role.name() == 'VIEWER'} ? ' text-bg-light border' : ' text-bg-primary')"
                              th:text="${u.role.label()}"></span></td>
                    <td>
                        <span th:if="${!u.enabled}" class="badge text-bg-secondary">Disabled</span>
                        <span th:if="${u.enabled and u.locked}" class="badge text-bg-danger" th:title="'Until ' + ${@time.format(u.lockedUntil)}">Locked</span>
                        <span th:if="${u.enabled and !u.locked}" class="badge text-bg-success">Active</span>
                        <span th:if="${u.failedAttempts > 0}" class="small text-secondary ms-1" th:text="${u.failedAttempts} + ' failed attempt(s)'"></span></td>
                    <td class="small" th:text="${@time.format(u.lastLoginAt)}"></td>
                    <td class="small"><span th:if="${u.mustChangePassword}" class="badge text-bg-warning">Temporary</span>
                        <span th:unless="${u.mustChangePassword}" th:text="'Changed ' + ${@time.format(u.passwordChangedAt)}"></span></td>
                    <td class="text-end text-nowrap">
                        <form th:if="${u.locked}" class="d-inline" method="post" th:action="@{/admin/users/{id}/unlock(id=${u.id})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Unlock</button></form>
                        <a class="btn btn-icon btn-sm btn-secondary-light" th:href="@{/admin/users/{id}/edit(id=${u.id})}" title="Edit" aria-label="Edit"><i class="bx bx-edit-alt"></i></a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
