<!DOCTYPE html>
<html lang="en" dir="ltr" data-nav-layout="vertical" data-theme-mode="light" data-header-styles="dark" data-menu-styles="dark" data-toggled="close" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="page">
<header th:replace="~{fragments/layout :: header}"></header>
<aside th:replace="~{fragments/layout :: sidebar('audit')}"></aside>
<main class="main-content app-content">
<div class="container-fluid">
    <div class="page-intro mb-4">
        <div class="eyebrow">ADMINISTRATION</div>
        <h1 class="h3 mb-1">Audit log</h1>
        <p class="text-secondary mb-0">Who did what, when and from where. Records are append-only: they cannot be changed or deleted in the application or the database.</p>
    </div>

    <form class="filter-bar mb-3 flex-wrap" method="get" th:action="@{/admin/audit}">
        <input class="form-control filter-app" name="q" th:value="${q}" placeholder="Search summary, ID or correlation ID" aria-label="Search">
        <input class="form-control filter-app" name="actor" th:value="${actor}" placeholder="User" aria-label="User">
        <select class="form-select filter-app" name="action" aria-label="Action" data-autosubmit>
            <option value="">All actions</option>
            <option th:each="a : ${actions}" th:value="${a}" th:text="${a}" th:selected="${a == action}"></option>
        </select>
        <select class="form-select filter-app" name="resourceType" aria-label="Resource type" data-autosubmit>
            <option value="">All resources</option>
            <option th:each="r : ${resourceTypes}" th:value="${r}" th:text="${r}" th:selected="${r == resourceType}"></option>
        </select>
        <select class="form-select filter-app" name="outcome" aria-label="Outcome" data-autosubmit>
            <option value="">All outcomes</option>
            <option th:each="o : ${outcomes}" th:value="${o}" th:text="${o}" th:selected="${o == outcome}"></option>
        </select>
        <input type="date" class="form-control filter-app" name="from" th:value="${from}" aria-label="From date">
        <input type="date" class="form-control filter-app" name="to" th:value="${to}" aria-label="To date">
        <button class="btn btn-outline-primary" type="submit">Filter</button>
        <a class="btn btn-link" th:if="${filtered}" th:href="@{/admin/audit}">Clear</a>
    </form>

    <section class="panel empty-state" th:if="${events.totalElements == 0}">
        <div class="empty-icon"><i class="bx bx-list-check"></i></div>
        <h2 class="h6" th:text="${filtered} ? 'No audit records match these filters' : 'No audit records yet'">No audit records</h2>
    </section>

    <section class="panel p-0" th:if="${events.totalElements > 0}">
        <div class="table-responsive">
            <table class="table align-middle mb-0 small">
                <thead><tr><th>When</th><th>User</th><th>Action</th><th>Resource</th><th>Outcome</th><th>Summary</th><th>Source</th></tr></thead>
                <tbody>
                <tr th:each="e : ${events.content}">
                    <td class="text-nowrap" th:text="${@time.format(e.occurredAt)}"></td>
                    <td class="text-nowrap"><a th:href="@{/admin/audit(actor=${e.actor})}" th:text="${e.actor}"></a></td>
                    <td class="text-nowrap"><code th:text="${e.action}"></code></td>
                    <td class="text-nowrap" th:text="${e.resourceType != null} ? ${e.resourceType} + (${e.resourceId != null} ? ' ' + ${e.resourceId} : '') : '—'"></td>
                    <td><span class="badge" th:classappend="${e.outcome.name() == 'SUCCESS'} ? ' text-bg-success' : (${e.outcome.name() == 'DENIED'} ? ' text-bg-dark' : ' text-bg-danger')"
                              th:text="${e.outcome}"></span></td>
                    <td class="text-break" style="min-width: 280px" th:text="${e.summary}"></td>
                    <td class="text-nowrap text-secondary"><span th:text="${e.sourceIp ?: '—'}"></span>
                        <div th:if="${e.correlationId != null}" th:title="'Correlation ID ' + ${e.correlationId}"><code th:text="${#strings.abbreviate(e.correlationId, 13)}"></code></div></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center px-4 py-3 border-top small">
            <span class="text-secondary" th:text="${events.totalElements} + ' record(s) · page ' + (${events.number} + 1) + ' of ' + ${events.totalPages}"></span>
            <ul class="pagination pagination-sm mb-0" th:if="${events.totalPages > 1}">
                <li class="page-item" th:classappend="${events.first} ? ' disabled'"><a class="page-link" th:href="@{/admin/audit(q=${q},actor=${actor},action=${action},resourceType=${resourceType},outcome=${outcome},from=${from},to=${to},page=${events.number - 1})}">Previous</a></li>
                <li class="page-item" th:classappend="${events.last} ? ' disabled'"><a class="page-link" th:href="@{/admin/audit(q=${q},actor=${actor},action=${action},resourceType=${resourceType},outcome=${outcome},from=${from},to=${to},page=${events.number + 1})}">Next</a></li>
            </ul>
        </div>
    </section>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
